name: Publish current APK

on:
  push:
    paths:
      - ".github/workflows/publish-current.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        run: |
          curl -L --fail --silent --show-error 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-3db4-820a-941d-69ed624f3fd3/raw?se=2026-09-11T05%3A08%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=01a08ed4-fbbc-7d3e-9f87-e7470ffec3c5&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T03%3A08%3A58Z&ske=2026-09-12T03%3A08%3A58Z&sks=b&skv=2026-02-06&sig=XPu8N1QxwtIGo9UwSyRX3rS77dCbUMSQ1MMVOgElWMI%3D' -o artifact.zip
          unzip -p artifact.zip android-app-debug.apk > windsurfer.apk
          printf '%s\n' '{"versionCode":6,"versionName":"0.3.3","apkUrl":"https://raw.githubusercontent.com/tomerpol/Windsurfer-updates/main/windsurfer.apk"}' > version.json
      - name: Publish update files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add windsurfer.apk version.json
          git commit -m "Publish Windsurfer 0.3.3"
          git push
