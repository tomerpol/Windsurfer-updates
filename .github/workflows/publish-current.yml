name: Publish current APK

on:
  push:
    paths:
      - ".github/workflows/publish-current.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        run: |
          curl -L --fail --silent --show-error 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-5994-820a-a277-9ac0cfef6496/raw?se=2026-09-11T05%3A00%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=01a08ecd-898f-759a-83e2-4ea50cde549a&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T04%3A23%3A01Z&ske=2026-09-12T04%3A23%3A01Z&sks=b&skv=2026-02-06&sig=VYS1aSLTyISwqjDR7FtNRUJi15xpa/zZ/BWEeyg8G1o%3D' -o artifact.zip
          unzip -p artifact.zip android-app-debug.apk > windsurfer.apk
          printf '%s\n' '{"versionCode":5,"versionName":"0.3.2","apkUrl":"https://raw.githubusercontent.com/tomerpol/Windsurfer-updates/main/windsurfer.apk"}' > version.json
      - name: Publish update files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add windsurfer.apk version.json
          git commit -m "Publish Windsurfer 0.3.2"
          git push
