name: Publish current APK

on:
  push:
    paths:
      - ".github/workflows/publish-current.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        run: |
          curl -L --fail --silent --show-error 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-56f0-820a-b95d-2ff369f11135/raw?se=2026-09-11T04%3A52%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=01a08ec7-502a-745d-9315-e446f64cdf4f&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T03%3A08%3A58Z&ske=2026-09-12T03%3A08%3A58Z&sks=b&skv=2026-02-06&sig=QwPxpgdXyhDmwP6WJFttDYGf/jYeWHxhp1uO4dYZyYU%3D' -o artifact.zip
          unzip -p artifact.zip android-app-debug.apk > windsurfer.apk
          printf '%s\n' '{"versionCode":4,"versionName":"0.3.1","apkUrl":"https://raw.githubusercontent.com/tomerpol/Windsurfer-updates/main/windsurfer.apk"}' > version.json
      - name: Publish update files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add windsurfer.apk version.json
          git commit -m "Publish Windsurfer 0.3.1"
          git push
