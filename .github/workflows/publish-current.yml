name: Publish Windsurfer 0.4.1 once

on:
  push:
    paths:
      - ".github/workflows/publish-current.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and publish signed APK
        run: |
          curl -L --fail --silent --show-error 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-59dc-820e-9bfb-43851661bc28/raw?se=2026-09-15T15%3A33%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a5a9-3fca-7e80-b71b-ecef1d62207d&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T05%3A18%3A31Z&ske=2026-09-16T05%3A18%3A31Z&sks=b&skv=2026-02-06&sig=VILJ2nuCDq%2BG570kdbcPj6pfEhKD2YaeRK9NXAHjYJo%3D' -o artifact.zip
          unzip -p artifact.zip android-app-debug.apk > windsurfer.apk
          printf '%s\n' '{"versionCode":8,"versionName":"0.4.1","apkUrl":"https://raw.githubusercontent.com/tomerpol/Windsurfer-updates/main/windsurfer.apk"}' > version.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add windsurfer.apk version.json
          git rm .github/workflows/publish-current.yml
          git commit -m "Publish Windsurfer 0.4.1 and remove temporary workflow"
          git push
